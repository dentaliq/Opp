    <style>
        :root {
            --primary-color: #5d3f6a;
            --secondary-color: #a777e3;
            --accent-color: #ffc107;
            --text-color: #2c3e50;
            --white-color: #fff;
            --light-bg: #f5f5f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            direction: rtl;
            background-color: var(--light-bg);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .header {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #7b4397, #dc2430);
            background-size: 400% 400%;
            animation: gradientAnimation 15s ease infinite;
            color: var(--white-color);
            text-align: center;
            padding: 5rem 0 3rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            border-bottom: 5px solid var(--accent-color);
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header h1 {
            font-family: 'Amiri', serif;
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.4);
            position: relative;
            animation: fadeInDown 1s ease-in-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 40px;
            max-width: 1400px;
            margin: 30px auto;
        }

        .gallery-item {
            background-color: var(--white-color);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.5s ease;
            opacity: 0;
            transform: translateY(40px) scale(0.9);
            cursor: pointer;
            text-align: center;
            border: 3px solid transparent;
            position: relative;
        }

        .gallery-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 3px solid var(--accent-color);
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .gallery-item:hover::before {
            opacity: 1;
        }

        .gallery-item.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .gallery-item:hover {
            transform: translateY(-15px) scale(1.03);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        .gallery-item img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);

            padding: 20px 15px;
            background-color: var(--light-bg);

            font-size: 1.8rem;
            color: var(--primary-color);
            margin-bottom: 8px;

        .product-info .price {

            font-weight: bold;
            font-size: 1.5rem;
            color: var(--text-color);
        }

            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.80);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
            opacity: 0;
            transition: opacity 0.5s ease;

        .lightbox.show {
            display: flex;
            opacity: 1;

            width: 80%;
            transform: scale(0.80);
            transition: transform 0.4s cubic-bezier(0.18, 1.25, 0.4, 1);
            border: 2px solid rgba(255, 193, 7, 0.4);
            transform-origin: center;
        }

        .lightbox.show .lightbox-content {
            transform: scale(1);
        }

            left: -100%;

                { name: 'عطر الفرح', image: 'X17.jpg', price: 110000 },
                { name: 'عطر السعادة', image: 'X18.jpg', price: 145750 },
                // أضف العطور الجديدة هنا بالترتيب
                // مثال: { name: 'عطر الشفق', image: 'X19.jpg', price: 150000 },
            ];

            function createGallery() {
                products.forEach((product, index) => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';

                    const img = document.createElement('img');
                    img.src = product.image;
                    img.alt = product.name;
                    img.onerror = function() {
                        this.src = 'https://via.placeholder.com/300x380/5d3f6a/ffffff?text=' + encodeURIComponent(product.name);
                    };

                    const info = document.createElement('div');
                    info.className = 'product-info';
                    
                    const name = document.createElement('h3');
                    name.textContent = product.name;

                    const price = document.createElement('div');
                    price.className = 'price';
                    price.textContent = `${product.price.toLocaleString('ar-SY')} د.ع`;
                    
                    info.appendChild(name);
                    info.appendChild(price);
                    item.appendChild(img);
                    item.appendChild(info);
                    gallery.appendChild(item);

                    setTimeout(() => {
                        item.classList.add('show');
                    }, index * 200);

                    item.addEventListener('click', () => {
                        showLightbox(product);
                    });
                });
            }

            function showLightbox(product) {
                document.getElementById('productPrice').value = product.price;
                document.getElementById('productName').value = product.name;

                quantityInput.value = 1;
                updateTotalPrice();

                lightbox.classList.add('show');
            }

            closeBtn.addEventListener('click', () => {
                lightbox.classList.remove('show');
            });

            window.addEventListener('click', (e) => {
                if (e.target === lightbox) {
                    lightbox.classList.remove('show');
                }
            });

            function updateTotalPrice() {
                const quantity = parseInt(quantityInput.value, 10);
                const price = parseFloat(document.getElementById('productPrice').value);
                if (quantity > 0 && price > 0) {
                    const total = quantity * price;
                    totalPriceSpan.textContent = `${total.toLocaleString('ar-SY')} د.ع`;
                } else {
                    totalPriceSpan.textContent = '0 د.ع';
                }
            }

            quantityInput.addEventListener('input', updateTotalPrice);

            // Function to send message to Telegram
            async function sendToTelegram(message) {
                const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
                
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            chat_id: chatId,
                            text: message,
                            parse_mode: 'HTML'
                        })
                    });
                    
                    const data = await response.json();
                    return data.ok;
                } catch (error) {
                    console.error('Error sending message to Telegram:', error);
                    return false;
                }
            }

            orderForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const data = {
                    name: document.getElementById('name').value,
                    phone: document.getElementById('phone').value,
                    quantity: quantityInput.value,
                    address: document.getElementById('address').value,
                    landmark: document.getElementById('landmark').value,
                    totalPrice: totalPriceSpan.textContent,
                    productName: document.getElementById('productName').value
                };

                // عرض صندوق التأكيد
                showConfirmationLightbox(data);
            });

            function showConfirmationLightbox(data) {
                // ملء تفاصيل الطلب في صندوق التأكيد
                confirmationDetails.innerHTML = `
                    <p><strong>المنتج:</strong> ${data.productName}</p>
                    <p><strong>الاسم:</strong> ${data.name}</p>
                    <p><strong>الهاتف:</strong> ${data.phone}</p>
                    <p><strong>الكمية:</strong> ${data.quantity}</p>
                    <p><strong>العنوان:</strong> ${data.address}</p>
                    <p><strong>نقطة الدالة:</strong> ${data.landmark}</p>
                    <p><strong>السعر الإجمالي:</strong> ${data.totalPrice}</p>
                `;
                
                // إظهار صندوق التأكيد وإخفاء صندوق الطلب
                lightbox.classList.remove('show');
                confirmationLightbox.classList.add('show');
            }

            confirmOrderBtn.addEventListener('click', async () => {
                const data = {
                    name: document.getElementById('name').value,
                    phone: document.getElementById('phone').value,
                    quantity: quantityInput.value,
                    address: document.getElementById('address').value,
                    landmark: document.getElementById('landmark').value,
                    totalPrice: totalPriceSpan.textContent,
                    productName: document.getElementById('productName').value
                };

                // إخفاء صندوق التأكيد وإظهار مؤشر التحميل
                confirmationLightbox.classList.remove('show');
                loadingIndicator.style.display = 'flex';

                // Create message for Telegram
                const message = `
                    <b>طلب جديد من عالم العطور الفاخرة</b>
                    <b>------------------------------</b>
                    <b>المنتج:</b> ${data.productName}
                    <b>الاسم:</b> ${data.name}
                    <b>الهاتف:</b> ${data.phone}
                    <b>الكمية:</b> ${data.quantity}
                    <b>العنوان:</b> ${data.address}
                    <b>نقطة الدالة:</b> ${data.landmark}
                    <b>السعر الإجمالي:</b> ${data.totalPrice}
                    <b>وقت الطلب:</b> ${new Date().toLocaleString('ar-SA')}
                `;

                // Send to Telegram
                const success = await sendToTelegram(message);
                
                // Hide loading indicator
                loadingIndicator.style.display = 'none';

                if (success) {
                    successMessage.style.display = 'block';
                } else {
                    alert('حدث خطأ في إرسال الطلب. يرجى المحاولة مرة أخرى أو الاتصال بنا مباشرة.');
                    lightbox.classList.add('show');
                }
                
                orderForm.reset();
            });

            cancelOrderBtn.addEventListener('click', () => {
                // العودة إلى نموذج الطلب
                confirmationLightbox.classList.remove('show');
                lightbox.classList.add('show');
            });

            successBtn.addEventListener('click', () => {
                successMessage.style.display = 'none';
            });

            createGallery();
        });
    </script>
</body>
</html>
